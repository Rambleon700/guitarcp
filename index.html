<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GuitarCP – Song Browser & Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* Layout */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #121212;
      color: #f5f5f5;
    }

    header {
      padding: 16px 24px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    main {
      padding: 16px 24px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
    }

    section {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
    }

    section h2 {
      margin-top: 0;
      font-size: 1.4rem;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    /* Song Browser */
    #songBrowserTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    #songBrowserTable th,
    #songBrowserTable td {
      padding: 6px 8px;
      border-bottom: 1px solid #333;
    }

    #songBrowserTable th {
      text-align: left;
      background: #222;
    }

    #songBrowserTable tr:hover {
      background: #252525;
    }

    .song-actions button {
      margin-right: 4px;
      padding: 4px 8px;
      font-size: 0.85rem;
    }

    /* Chord Viewer + Practice */
    #chordViewerContainer {
      text-align: center;
    }

    #chordViewer {
      margin: 0 auto;
      width: 260px;
      height: 260px;
    }

    #viewerButtons {
      margin-top: 10px;
    }

    #viewerButtons button {
      padding: 8px 14px;
      margin: 4px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
    }

    .song-title {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 10px;
      color: #ffffff; /* white */
    }

    #practiceControls {
      margin-top: 10px;
      text-align: center;
    }

    #practiceControls button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 6px;
    }

    /* Practice Form */
    #practiceForm {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      margin-top: 12px;
      font-size: 0.9rem;
    }

    #practiceForm label {
      display: block;
      margin-bottom: 4px;
    }

    #practiceForm input,
    #practiceForm select {
      width: 100%;
      padding: 4px 6px;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #444;
      background: #111;
      color: #f5f5f5;
    }

    #practiceFormButtons {
      grid-column: 1 / span 2;
      text-align: center;
      margin-top: 8px;
    }

    #practiceFormButtons button {
      padding: 8px 16px;
      margin: 4px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
    }

    /* BPM display */
    #bpmPanel {
      margin-top: 10px;
      text-align: center;
      font-size: 0.95rem;
    }

    #bpmSlider {
      width: 80%;
      margin-top: 6px;
    }

    /* Rhythm + Strum */
    #rhythmGrid {
      margin-top: 12px;
    }

    #strum-arrows {
      margin-top: 8px;
    }
  </style>
</head>
<body>

<header>
  <h1>GuitarCP – Song Browser & Practice</h1>
</header>

<main>

  <!-- ============================
       LEFT: SONG BROWSER
       ============================ -->
  <section id="songBrowserSection">
    <h2>Song Browser</h2>

    <table id="songBrowserTable">
      <thead>
        <tr>
          <th>Title</th>
          <th>Artist</th>
          <th>Chords</th>
          <th>Strumming</th>
          <th>BPM</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="songBrowserBody">
        <!-- Populated by songs.js (renderSongList) -->
      </tbody>
    </table>
  </section>

  <!-- ============================
       RIGHT: CHORD VIEWER + PRACTICE
       ============================ -->
  <section id="practiceSection">
    <h2>Chord Viewer & Practice</h2>

    <!-- Chord Viewer + Title + Viewer Buttons + Practice Controls -->
    <div id="chordViewerContainer">

      <!-- Chord Viewer SVG injected by chords.js / engine.js -->
      <div id="chordViewer"></div>

      <!-- Song Title (white) -->
      <div id="currentSongTitle" class="song-title"></div>

      <!-- Viewer Buttons -->
      <div id="viewerButtons">
        <button id="playChordBtn">Play Chord</button>
        <button id="nextVoicingBtn">Next Voicing</button>
      </div>

      <!-- Practice Start / Stop -->
      <div id="practiceControls">
        <button id="practiceStart">Start</button>
        <button id="practiceStop">Stop</button>
      </div>

      <!-- BPM Panel -->
      <div id="bpmPanel">
        <span>BPM: <span id="bpmDisplay">72</span></span><br>
        <input type="range" id="bpmSlider" min="40" max="160" value="72">
      </div>

      <!-- Rhythm Grid + Strum Arrows -->
      <div id="rhythmGrid"></div>
      <div id="strum-arrows"></div>

    </div>

    <!-- Practice Form (Custom Exercise) -->
    <div id="practiceForm">

      <div>
        <label for="customChords">Chords (comma separated)</label>
        <input id="customChords" type="text" placeholder="e.g. Em7, G, Dsus4, A7sus4">
      </div>

      <div>
        <label for="customPattern">Strumming Pattern</label>
        <input id="customPattern" type="text" placeholder="e.g. D DU UDU">
      </div>

      <div>
        <label for="customBPM">Base BPM</label>
        <input id="customBPM" type="number" value="72">
      </div>

      <div>
        <label for="customTempoMode">Tempo Mode</label>
        <select id="customTempoMode">
          <option value="static">Static</option>
          <option value="ramp">Ramp</option>
        </select>
      </div>

      <div>
        <label for="customDuration">Duration (seconds)</label>
        <input id="customDuration" type="number" value="60">
      </div>

      <div>
        <label for="customDifficulty">Difficulty</label>
        <select id="customDifficulty">
          <option value="1">Easy</option>
          <option value="2" selected>Medium</option>
          <option value="3">Hard</option>
        </select>
      </div>

      <div id="practiceFormButtons">
        <button id="addExercise">Add to Queue</button>
        <button id="startExercise">Start Custom Exercise</button>
      </div>
    </div>

  </section>

</main>

<!-- ============================
     SCRIPTS
     ===========================
<script src="js/engine.js"></script>
<script src="js/chords.js"></script>
<script src="js/songs.js"></script>
<script src="js/practice.js"></script>

<script>
  // Load songs into the Song Browser
  initSongBrowser();

  // Viewer buttons
  document.getElementById("playChordBtn").onclick = () => {
    if (PracticeSession.currentExercise && PracticeSession.currentExercise.chords.length) {
      playChordAudio(PracticeSession.currentExercise.chords[0]);
    }
  };

  document.getElementById("nextVoicingBtn").onclick = () => {
    if (typeof nextVoicing === "function") {
      nextVoicing();
    }
  };
</script>
</body>
</html>
