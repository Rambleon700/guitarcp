<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GuitarCP – Song Browser & Practice Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    main { 
      display: grid; 
      grid-template-columns: 1.35fr 1fr; 
      gap: 24px; 
    }
    .song-search { 
      width: 100%; 
      padding: 12px; 
      margin-bottom: 16px; 
      background: #222; 
      color: #fff; 
      border: 1px solid #444; 
      border-radius: 8px; 
    }
    .song-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffdd88;
      margin: 12px 0 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>GuitarCP – Practice Tool</h1>
  </header>

  <main>
    <!-- Song Browser -->
    <section>
      <h2>Song Browser</h2>
      <input type="text" id="songSearch" class="song-search" placeholder="Search songs or artists...">
      <table id="songBrowserTable">
        <thead>
          <tr>
            <th>Title</th>
            <th>Artist</th>
            <th>Chords</th>
            <th>Strum</th>
            <th>BPM</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="songBrowserBody"></tbody>
      </table>
    </section>

    <!-- Chord + Practice -->
    <section>
      <h2>Chord Viewer & Practice</h2>
      <div id="chordViewerContainer" style="text-align:center;">
        
        <div id="chordViewer"></div>
        <div id="currentSongTitle" class="song-title"></div>

        <div style="margin: 20px 0;">
          <button id="playChordBtn">Play Chord</button>
          <button id="nextVoicingBtn">Next Voicing</button>
        </div>

        <div style="margin: 16px 0;">
          <button id="practiceStartBtn">Start Practice</button>
          <button id="practiceStopBtn">Stop</button>
        </div>

        <div id="bpmPanel">
          <label>BPM: <span id="bpmDisplay">80</span></label><br>
          <input type="range" id="bpmSlider" min="40" max="160" value="80" style="width:80%;">
        </div>

        <div id="rhythmGrid"></div>
        <div id="strum-arrows"></div>

        <!-- Custom Exercise -->
        <div class="exercise-builder" style="margin-top: 30px;">
          <h3>Custom Exercise</h3>
          <button id="startCustom">Start Custom Exercise</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/chords.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/practice.js"></script>

  <script>
    window.addEventListener('load', () => {
      // Initialize song browser
      if (typeof initSongBrowser === 'function') initSongBrowser();

      // Load default chord
      if (typeof loadChord === 'function') loadChord("C");
      if (typeof renderRhythmGrid === 'function') renderRhythmGrid("D DU UDU");
      if (typeof renderStrumArrows === 'function') renderStrumArrows();

      // Button Handlers
      document.getElementById("playChordBtn").addEventListener("click", () => {
        if (typeof playChordAudio === "function") {
          playChordAudio("Em"); // Default or current chord
        }
      });

      document.getElementById("practiceStartBtn").addEventListener("click", () => {
        if (typeof startCustomExercise === "function") {
          const ex = {
            chords: ["Em", "C", "G", "D"],
            pattern: "D DU UDU",
            bpm: 80,
            duration: 60
          };
          startCustomExercise(ex);
        }
      });

      document.getElementById("practiceStopBtn").addEventListener("click", () => {
        if (typeof stopPracticeSession === "function") {
          stopPracticeSession();
        }
      });

      // BPM Slider
      const slider = document.getElementById("bpmSlider");
      slider.addEventListener("input", (e) => {
        document.getElementById("bpmDisplay").textContent = e.target.value;
      });
    });
  </script>
</body>
</html>
