<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GuitarCP – Song Browser & Practice Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Additional inline improvements - keep minimal */
    main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; }
    .song-search { width: 100%; padding: 8px; margin-bottom: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>GuitarCP – Practice Tool</h1>
  </header>

  <main>
    <!-- Song Browser -->
    <section>
      <h2>Song Browser</h2>
      <input type="text" id="songSearch" class="song-search" placeholder="Search songs or artists...">
      <table id="songBrowserTable">
        <thead>
          <tr>
            <th>Title</th><th>Artist</th><th>Chords</th><th>Strum</th><th>BPM</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="songBrowserBody"></tbody>
      </table>
    </section>

    <!-- Chord + Practice -->
    <section>
      <h2>Chord Viewer & Practice</h2>
      <div id="chordViewerContainer" style="text-align:center;">
<div id="chordViewer"></div>

<div id="currentSongTitle" class="song-title"></div>

<div id="viewerButtons" style="margin: 20px 0;">
  <button id="playChordBtn">Play Chord</button>
  <button id="nextVoicingBtn">Next Voicing</button>
</div>

<div id="practiceControls" style="margin: 16px 0;">
  <button id="practiceStartBtn">Start Practice</button>
  <button id="practiceStopBtn">Stop</button>
</div>

<div id="bpmPanel">
  <label>BPM: <span id="bpmDisplay">80</span></label>
  <input type="range" id="bpmSlider" min="40" max="160" value="80">
</div>

<div id="rhythmGrid"></div>
<div id="strum-arrows"></div> 

      <!-- Custom Exercise -->
      <div class="exercise-builder">
        <h3>Custom Exercise</h3>
        <!-- (form fields as before, shortened for brevity) -->
        <button id="startCustom">Start Custom</button>
      </div>
    </section>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/chords.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/practice.js"></script>
  <script>
    // Init
    window.addEventListener('load', () => {
      initSongBrowser();
      // Default load
      loadChord("C");
      renderRhythmGrid("D DU UDU");
      renderStrumArrows();
    });
  </script>
  <script>
  // Initialize everything
  window.addEventListener('load', () => {
    initSongBrowser();
    
    // Default chord
    if (typeof loadChord === 'function') loadChord("C");

    // Button handlers
    const playBtn = document.getElementById("playChordBtn");
    const nextBtn = document.getElementById("nextVoicingBtn");
    const startBtn = document.getElementById("practiceStartBtn");
    const stopBtn = document.getElementById("practiceStopBtn");

    if (playBtn) playBtn.addEventListener("click", () => {
      if (typeof playChordAudio === "function" && PracticeSession.currentExercise) {
        playChordAudio(PracticeSession.currentExercise.chords[0] || "C");
      }
    });

    if (nextBtn) nextBtn.addEventListener("click", () => {
      console.log("Next voicing clicked");
      // Add logic later if you want multiple voicings
    });

    if (startBtn) startBtn.addEventListener("click", () => {
      if (typeof startCustomExercise === "function") {
        const ex = buildCustomExercise ? buildCustomExercise() : {chords: ["Em"], pattern: "D DU UDU", bpm: 80, duration: 60};
        startCustomExercise(ex);
      }
    });

    if (stopBtn) stopBtn.addEventListener("click", () => {
      if (typeof stopPracticeSession === "function") stopPracticeSession();
    });

    // BPM Slider
    const slider = document.getElementById("bpmSlider");
    if (slider) {
      slider.addEventListener("input", (e) => {
        if (typeof PracticeSession !== "undefined") {
          PracticeSession.bpm = parseInt(e.target.value);
        }
        document.getElementById("bpmDisplay").textContent = e.target.value;
      });
    }
  });
</script>
</body>
</html>
