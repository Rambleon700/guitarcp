<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guitar Practice Engine – Powered by Copilot</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>Guitar Practice Engine</h1>
    <p>Interactive chords, strumming, rhythm grid, practice sessions, song browser, and performance mode.</p>
  </header>

  <main>

    <!-- Chord Viewer -->
    <section>
      <h2>Chord Viewer</h2>
      <div id="chordName"></div>
      <div id="chordViewer"></div>
      <button id="playChord">Play Chord</button>
      <button id="nextVoicing">Next Voicing</button>
      <div id="currentSongTitle" class="song-title"></div>
      
    </section>

    <!-- Strumming + Rhythm -->
    <section>
      <h2>Strumming & Rhythm</h2>
      <div id="strum-arrows"></div>
      <div id="rhythmGrid"></div>
      <button id="strumDown">Strum Down</button>
      <button id="strumUp">Strum Up</button>
    </section>

    <!-- Practice Engine -->
    <section>
      <h2>Practice Engine</h2>
      <div id="tempoControl">
        <label>BPM: <span id="bpmDisplay">72</span></label>
        <input type="range" id="bpmSlider" min="40" max="180" value="72">
      </div>

      <div id="exerciseBuilder" class="exercise-builder">
        <h3>Create Custom Exercise</h3>
        <label>Chords:</label>
        <input id="customChords" placeholder="Am, G, F, C">
        <label>Strumming Pattern:</label>
        <input id="customPattern" placeholder="D DU UDU">
        <label>BPM:</label>
        <input type="number" id="customBPM" value="72">
        <label>Tempo Mode:</label>
        <select id="customTempoMode">
          <option value="static">Static</option>
          <option value="ramp">Ramp</option>
          <option value="curve">Curve</option>
        </select>
        <label>Duration (seconds):</label>
        <input type="number" id="customDuration" value="60">
        <label>Difficulty:</label>
        <select id="customDifficulty">
          <option value="1">Beginner</option>
          <option value="2">Intermediate</option>
          <option value="3">Advanced</option>
        </select>
        <button id="addExercise">Add to Practice Queue</button>
        <button id="startExercise">Start Exercise</button>
      </div>
    </section>

    <!-- Song Browser -->
    <section>
      <h2>Song Browser</h2>
      <div id="songBrowserControls">
        <input id="songSearch" placeholder="Search songs or artists">
        <select id="songSort">
          <option value="title">Title</option>
          <option value="artist">Artist</option>
          <option value="bpm">BPM</option>
        </select>
      </div>
      <div id="songList"></div>
    </section>

    <!-- Performance Mode trigger -->
    <section>
      <h2>Performance Mode</h2>
      <button id="enterPerformance">Enter Performance (Wonderwall)</button>
    </section>

  </main>

  <!-- Performance Overlay -->
  <div id="performanceMode" class="performance-mode hidden">
    <div class="perf-header">
      <h2 id="perfSongTitle"></h2>
      <button id="perfExit">Exit</button>
    </div>
    <div class="perf-main">
      <div id="perfChordViewer"></div>
      <div id="perfStrumArrows"></div>
      <div id="perfRhythmGrid"></div>
    </div>
    <div class="perf-footer">
      <div id="perfMetronome" class="metronome"></div>
      <div id="perfControls">
        <button id="perfPlay">Play</button>
        <button id="perfPause">Pause</button>
        <button id="perfRestart">Restart</button>
        <button id="perfVideoToggle">Video Mode</button>
      </div>
    </div>
    <div id="perfVideoContainer" class="perf-video hidden">
      <video id="perfVideo" preload="auto"></video>
    </div>
  </div>

  <script src="js/songs.js"></script>
  <script src="js/chords.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/performance.js"></script>
</body>
</html>
